# Theme: Yorumi Mist
# Author: yorumicolors

# Syntax highlighting
"attribute" = "kuroiOrange"

"type" = "kuroiYellow"
"type.enum.variant" = "umiCyan"

"constructor" = "kuroiBlue"

"constant" = "umiYellow"
"constant.character" = "umiCyan"
"constant.character.escape" = "umiMagenta"

"string" = "umiGreen"
"string.regexp" = "umiMagenta"
"string.special" = "umiBlue"
"string.special.symbol" = "umiRed"

"comment" = { fg = "tsuki0" }

"variable" = "kuroiCyan"
"variable.parameter" = { fg = "umiMagenta" }
"variable.builtin" = "umiRed"
"variable.other.member" = "umiBlue"

"label" = "kuroiBlue" # used for lifetimes

"punctuation" = "tsuki1"
"punctuation.special" = "kairoBlue"

"keyword" = "umiViolet"
"keyword.control.conditional" = { fg = "umiViolet" }

"operator" = "kairoBlue"

"function" = "umiBlue"
"function.macro" = "umiViolet"

"tag" = "umiBlue"

"namespace" = { fg = "umiYellow" }

"special" = "umiBlue" # fuzzy highlight

"markup.heading.1" = "umiRed"
"markup.heading.2" = "kuroiYellow"
"markup.heading.3" = "umiYellow"
"markup.heading.4" = "umiGreen"
"markup.heading.5" = "umiBlue"
"markup.heading.6" = "umiViolet"
"markup.list" = "umiCyan"
"markup.list.unchecked" = "tsuki1"
"markup.list.checked" = "umiGreen"
"markup.bold" = { fg = "umiRed", modifiers = ["bold"] }
"markup.italic" = { fg = "umiRed", modifiers = ["italic"] }
"markup.link.url" = { fg = "umiBlue", modifiers = ["underlined"] }
"markup.link.text" = "tsukiViolet"
"markup.raw" = "umiGreen"
"markup.quote" = "kuroiMagenta"

"diff.plus" = "umiGreen"
"diff.minus" = "umiRed"
"diff.delta" = "umiBlue"

# User interface
"ui.background" = { fg = "yoru0", bg = "tsuki3" }

"ui.linenr" = { fg = "tsuki2" }
"ui.linenr.selected" = { fg = "tsuki0" }

"ui.statusline" = { fg = "tsuki3", bg = "yoru4" }
"ui.statusline.inactive" = { fg = "tsuki3", bg = "tsuki1" }

"ui.statusline.normal" = { fg = "tsukiBlue", bg = "umiGreen" }
"ui.statusline.insert" = { fg = "tsukiBlue", bg = "umiBlue"  }
"ui.statusline.select" = { fg = "tsukiBlue", bg = "umiOrange" }

"ui.popup" = { fg = "tsuki0", bg = "tsuki2" }
"ui.window" = { fg = "tsuki0", bg = "tsuki2" }
"ui.help" = { fg = "tsuki0", bg = "tsuki2" }

"ui.bufferline" = { fg = "tsuki0", bg = "tsuki2" }
"ui.bufferline.active" = { fg = "tsuki3", bg = "yoru4"}
"ui.bufferline.background" = { bg = "tsuki3" }

"ui.text" = "tsuki0"
"ui.text.focus" = { fg = "tsuki3", bg = "yoru4", modifiers = ["bold"] }
"ui.text.inactive" = { fg = "tsuki1" }
"ui.text.directory" = { fg = "umiBlue" }

"ui.virtual" = "tsuki1"
"ui.virtual.ruler" = { bg = "yoru3" }
"ui.virtual.indent-guide" = "yoru3"
"ui.virtual.inlay-hint" = { fg = "tsuki1", bg = "yoru1" }
"ui.virtual.jump-label" = { fg = "sangoOrange", modifiers = ["bold"] }

"ui.selection" = { bg = "yoru4", fg = "tsuki3" }  
"ui.cursor" = { fg = "tsuki3", bg = "yoru0" }
"ui.cursor.primary" = { fg = "yoru0", bg = "sangoOrange" }
"ui.cursor.match" = { fg = "sangoYellow", modifiers = ["bold"] }

"ui.cursor.primary.normal" = { fg = "yoru0", bg = "umiGreen" }
"ui.cursor.primary.insert" = { fg = "yoru0", bg = "umiBlue" }
"ui.cursor.primary.select" = { fg = "yoru0", bg = "umiOrange" }

"ui.cursor.normal" = { fg = "tsuki3", bg = "umiBlue" }
"ui.cursor.insert" = { fg = "tsuki3", bg = "umiGreen" }
"ui.cursor.select" = { fg = "tsuki3", bg = "sangoMagenta" }

"ui.cursorline.primary" = { bg = "yoru3" }

"ui.highlight" = { bg = "tsukiViolet", modifiers = ["bold"] }

"ui.menu" = { fg = "tsuki0", bg = "tsuki2" }
"ui.menu.selected" = { fg = "tsuki3", bg = "yoru4", modifiers = ["bold"] }

"diagnostic.error" = { underline = { color = "umiRed", style = "curl" } }
"diagnostic.warning" = { underline = { color = "umiYellow", style = "curl" } }
"diagnostic.info" = { underline = { color = "kairoBlue", style = "curl" } }
"diagnostic.hint" = { underline = { color = "umiCyan", style = "curl" } }
"diagnostic.unnecessary" = { modifiers = ["dim"] }

error = "umiRed"
warning = "umiYellow"
info = "kairoBlue"
hint = "umiCyan"

