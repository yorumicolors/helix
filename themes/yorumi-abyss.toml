# Theme: Yorumi Abyss
# Author: yorumicolors

# Syntax highlighting
"attribute" = "sangoOrange"

"type" = "sangoYellow"
"type.enum.variant" = "sangoCyan"

"constructor" = "sangoBlue"

"constant" = "sangoOrange"
"constant.character" = "umiCyan"
"constant.character.escape" = "sangoMagenta"

"string" = "kairoGreen"
"string.regexp" = "sangoRed"
"string.special" = "umiBlue"
"string.special.symbol" = "sangoYellow"

"comment" = { fg = "tsuki0" }

"variable" = { fg = "tsuki3" }
"variable.parameter" = { fg = "tsuki2" }
"variable.builtin" = { fg = "sangoRed" }
"variable.member" = "sangoYellow"
"variable.other.member" = "sangoBlue"

"label" = "sangoBlue" 

"punctuation" = "tsuki2"
"punctuation.special" = "sangoCyan"

"keyword" = "sangoViolet"
"keyword.control.conditional" = { fg = "sangoViolet" }

"operator" = "tsuki2"

"function" = "kairoBlue"
"function.macro" = "sangoViolet"

"tag" = "umiBlue"

"namespace" = { fg = "tsuki3" }

"special" = "umiBlue"

"markup.heading.1" = "sangoBlue"
"markup.heading.2" = "sangoBlue"
"markup.heading.3" = "sangoBlue"
"markup.heading.4" = "sangoBlue"
"markup.heading.5" = "sangoBlue"
"markup.heading.6" = "sangoBlue"

"markup.list" = "umiCyan"
"markup.list.unchecked" = "tsuki2"
"markup.list.checked" = "umiGreen"
"markup.bold" = { fg = "kuroiRed", modifiers = ["bold"] }
"markup.italic" = { fg = "kuroiRed", modifiers = ["italic"] }
"markup.link.url" = { fg = "umiBlue", modifiers = ["underlined"] }
"markup.link.text" = "sangoYellow"
"markup.raw" = "kairoGreen"
"markup.quote" = "sangoMagenta"

"diff.plus" = "sangoGreen"
"diff.minus" = "sangoRed"
"diff.delta" = "sangoBlue"

# User Interface
"ui.background" = { fg = "tsuki3", bg = "yoru0" }

"ui.linenr" = { fg = "tsuki1" }
"ui.linenr.selected" = { fg = "sangoYellow" }

"ui.statusline" = { fg = "tsuki3", bg = "yoru2" }
"ui.statusline.inactive" = { fg = "tsuki3", bg = "yoru1" }
# TODO:
# Fixing higlights for modes later to match neovim once the neovim port is finished
"ui.statusline.normal" = { fg = "tsukiBlue", bg = "umiGreen", modifiers = ["bold"] }
"ui.statusline.insert" = { fg = "tsukiBlue", bg = "umiBlue", modifiers = ["bold"]  }
"ui.statusline.select" = { fg = "tsukiBlue", bg = "umiOrange", modifiers = ["bold"]  }

"ui.popup" = { fg = "tsuki2", bg = "yoru3" }
"ui.window" = { fg = "yoru0" }
"ui.help" = { fg = "tsuki2", bg = "yoru3" }

"ui.bufferline" = { fg = "tsuki3", bg = "yoru4" }
"ui.bufferline.active" = { fg = "tsuki1", bg = "yoru2" }
"ui.bufferline.background" = { bg = "yoru2" }

"ui.text" = "tsuki3"
"ui.text.focus" = { fg = "tsuki3", bg = "yoru4", modifiers = ["bold"] }
"ui.text.inactive" = { fg = "tsuki2" }
"ui.text.directory" = { fg = "sangoBlue" }

"ui.virtual" = "tsuki3"
"ui.virtual.ruler" = { bg = "yoru2" }
"ui.virtual.indent-guide" = "yoru2"
"ui.virtual.inlay-hint" = { fg = "tsuki2", bg = "yoru2" }
"ui.virtual.jump-label" = { fg = "kuroiRed", modifiers = ["bold"] }

"ui.selection" = { bg = "yoru4", fg = "tsuki3" }

"ui.cursor" = { fg = "yoru0", bg = "umiYellow" }
"ui.cursor.primary" = { fg = "yoru0", bg = "tsuki1" }
"ui.cursor.match" = { fg = "kuroiYellow", modifiers = ["bold"] }

# TODO:
# Fix the cursor highlights and match them properly when the cursor is
# in one of these modes
"ui.cursor.primary.normal" = { fg = "yoru0", bg = "umiGreen" }
"ui.cursor.primary.insert" = { fg = "yoru0", bg = "umiBlue" }
"ui.cursor.primary.select" = { fg = "yoru0", bg = "umiOrange" }

"ui.cursor.normal" = { fg = "yoru0", bg = "umiGreen" }
"ui.cursor.insert" = { fg = "yoru0", bg = "umiBlue" }
"ui.cursor.select" = { fg = "yoru0", bg = "umiOrange" }

"ui.cursorline.primary" = { bg = "yoru3" }

"ui.highlight" = { bg = "tsuki2", modifiers = ["bold"] }

"ui.menu" = { fg = "tsuki3", bg = "yoru3" }
"ui.menu.selected" = { fg = "tsukiBlue", bg = "yoru4", modifiers = ["bold"] }

"diagnostic.error" = { underline = { color = "sangoRed", style = "curl" } }
"diagnostic.warning" = { underline = { color = "sangoYellow", style = "curl" } }
"diagnostic.info" = { underline = { color = "kairoBlue", style = "curl" } }
"diagnostic.hint" = { underline = { color = "sangoCyan", style = "curl" } }
"diagnostic.unnecessary" = { modifiers = ["dim"] }

error = "sangoRed"
warning = "sangoYellow"
info = "kairoBlue"
hint = "sangoCyan"

