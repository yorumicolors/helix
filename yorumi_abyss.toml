# Syntax highlighting
# -------------------
"attribute" = "umiYellow"

"type" = "umiYellow"
"type.enum.variant" = "umiCyan"

"constructor" = "sangoBlue"

"constant" = "kuroiYellow"
"constant.character" = "umiCyan"
"constant.character.escape" = "kuroiViolet"

"string" = "umiGreen"
"string.regexp" = "sangoViolet"
"string.special" = "umiBlue"
"string.special.symbol" = "umiRed"

"comment" = { fg = "tsuki0" }

"variable" = "sangoCyan"
"variable.parameter" = { fg = "kuroiRed" }
"variable.builtin" = "umiRed"
"variable.other.member" = "umiBlue"

"label" = "sangoBlue" # used for lifetimes

"punctuation" = "tsuki1"
"punctuation.special" = "umiMagenta"

"keyword" = "sangoViolet"
"keyword.control.conditional" = { fg = "sangoViolet" }

"operator" = "umiYellow"

"function" = "umiBlue"
"function.macro" = "sangoViolet"

"tag" = "umiBlue"

"namespace" = { fg = "sangoYellow" }

"special" = "umiBlue" # fuzzy highlight

"markup.heading.1" = "kuroiRed"
"markup.heading.2" = "kuroiGreen"
"markup.heading.3" = "umiGreen"
"markup.heading.4" = "umiYellow"
"markup.heading.5" = "umiBlue"
"markup.heading.6" = "kuroiBlue"
"markup.list" = "umiCyan"
"markup.list.unchecked" = "tsuki2"
"markup.list.checked" = "umiGreen"
"markup.bold" = { fg = "kuroiRed", modifiers = ["bold"] }
"markup.italic" = { fg = "kuroiRed", modifiers = ["italic"] }
"markup.link.url" = { fg = "umiBlue", modifiers = ["underlined"] }
"markup.link.text" = "sangoYellow"
"markup.raw" = "umiGreen"
"markup.quote" = "sangoMagenta"

"diff.plus" = "umiGreen"
"diff.minus" = "kuroiRed"
"diff.delta" = "umiBlue"

# User Interface
# --------------
"ui.background" = { fg = "text", bg = "yoru0" }

"ui.linenr" = { fg = "tsuki1" }
"ui.linenr.selected" = { fg = "sangoYellow" }

"ui.statusline" = { fg = "tsuki2", bg = "yoru1" }
"ui.statusline.inactive" = { fg = "tsuki3", bg = "yoru1" }
"ui.statusline.normal" = { fg = "yoru0", bg = "umiMagenta", modifiers = ["bold"] }
"ui.statusline.insert" = { fg = "yoru0", bg = "umiGreen", modifiers = ["bold"]  }
"ui.statusline.select" = { fg = "yoru0", bg = "umiOrange", modifiers = ["bold"]  }

"ui.popup" = { fg = "text", bg = "yoru2" }
"ui.window" = { fg = "kuroiBlack" }
"ui.help" = { fg = "tsuki0", bg = "yoru2" }

"ui.bufferline" = { fg = "sangoMagenta", bg = "yoru3" }
"ui.bufferline.active" = { fg = "umiBlue", bg = "yoru0", underline = { color = "umiBlue", style = "line" } }
"ui.bufferline.background" = { bg = "kuroiBlack" }

"ui.text" = "text"
"ui.text.focus" = { fg = "text", bg = "yoru2", modifiers = ["bold"] }
"ui.text.inactive" = { fg = "tsuki0" }
"ui.text.directory" = { fg = "umiBlue" }

"ui.virtual" = "tsuki3"
"ui.virtual.ruler" = { bg = "yoru2" }
"ui.virtual.indent-guide" = "yoru2"
"ui.virtual.inlay-hint" = { fg = "tsuki2", bg = "yoru1" }
"ui.virtual.jump-label" = { fg = "kuroiRed", modifiers = ["bold"] }

"ui.selection" = { bg = "tsuki2" }

"ui.cursor" = { fg = "yoru0", bg = "umiYellow" }
"ui.cursor.primary" = { fg = "yoru0", bg = "tsuki3" }
"ui.cursor.match" = { fg = "kuroiYellow", modifiers = ["bold"] }

"ui.cursor.primary.normal" = { fg = "yoru0", bg = "tsuki3" }
"ui.cursor.primary.insert" = { fg = "yoru0", bg = "umiGreen" }
"ui.cursor.primary.select" = { fg = "yoru0", bg = "umiOrange" }

"ui.cursor.normal" = { fg = "yoru0", bg = "secondary_cursor_normal" }
"ui.cursor.insert" = { fg = "yoru0", bg = "secondary_cursor_insert" }
"ui.cursor.select" = { fg = "yoru0", bg = "secondary_cursor" }

"ui.cursorline.primary" = { bg = "yoru3" }

"ui.highlight" = { bg = "tsuki2", modifiers = ["bold"] }

"ui.menu" = { fg = "tsuki0", bg = "yoru2" }
"ui.menu.selected" = { fg = "text", bg = "tsuki1", modifiers = ["bold"] }

"diagnostic.error" = { underline = { color = "kuroiRed", style = "curl" } }
"diagnostic.warning" = { underline = { color = "umiYellow", style = "curl" } }
"diagnostic.info" = { underline = { color = "umiBlue", style = "curl" } }
"diagnostic.hint" = { underline = { color = "umiCyan", style = "curl" } }
"diagnostic.unnecessary" = { modifiers = ["dim"] }

error = "kuroiRed"
warning = "umiYellow"
info = "umiBlue"
hint = "umiCyan"

